[package]
name = "secrets"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1"

# keyring 3.x has no default backend — see crates/secrets/src/lib.rs's
# module doc for how that was discovered (a fresh `Entry` couldn't read
# back what another fresh `Entry` had just stored: no real backend was
# compiled in, just an implicit no-op). One persistent, synchronous native
# backend per platform, matching this app's only currently-built/tested
# target (Linux/Tauri, see docs/architecture) but written for all three so
# this doesn't silently regress if that changes.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
